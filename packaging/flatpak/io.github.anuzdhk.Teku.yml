# Untested draft for Flathub. Installs run on the host through
# flatpak-spawn --host, which needs org.freedesktop.Flatpak — explain this in
# the Flathub submission: Teku's whole job is installing host packages.
id: io.github.anuzdhk.Teku
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: teku
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --filesystem=home
  - --talk-name=org.freedesktop.Flatpak
modules:
  - name: zenity
    buildsystem: meson
    sources:
      - type: archive
        url: https://download.gnome.org/sources/zenity/4.2/zenity-4.2.1.tar.xz
        sha256: FIXME
  - name: teku
    buildsystem: simple
    build-commands:
      - make install PREFIX=/app
    sources:
      - type: dir
        path: ../..
