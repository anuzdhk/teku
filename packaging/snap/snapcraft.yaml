# Untested draft. Needs classic confinement, which the Snap Store reviews by
# hand and often refuses for installers — see README.
name: teku
base: core24
version: '0.1.1'
summary: Install apps from a right-click
description: |
  Teku detects a downloaded file's type and your distro, then installs
  .deb, .rpm, AppImage and .flatpakref files, or explains why it can't.
grade: stable
confinement: classic

apps:
  teku:
    command: usr/bin/teku

parts:
  teku:
    plugin: make
    source: .
    make-parameters: [PREFIX=/usr]
    stage-packages: [zenity, file]
